<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Fight Arena NBT Builder</title>
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f0813a'/%3E%3Cpath d='M9 7h14v4H14v4h7v4h-7v6H9z' fill='%23181411'/%3E%3C/svg%3E">
	<link rel="stylesheet" href="src/styles.css">
</head>
<body>
	<div id="app">
		<header id="top"></header>
		<main id="work">
			<aside id="rail" aria-label="Navigator"></aside>
			<section id="editor" aria-label="Line-up"></section>
			<aside id="palette" aria-label="Mobs"></aside>
		</main>
		<footer id="foot"></footer>
	</div>
	<div id="drop" hidden><div>Drop an .nbt file to open it</div></div>
	<div id="toasts" role="status" aria-live="polite"></div>
	<div id="modal"></div>
	<input id="picker" type="file" accept=".nbt" hidden>
	<script src="src/data.js"></script>
	<script src="src/nbt.js"></script>
	<script src="src/model.js"></script>
	<script src="src/cloud.js"></script>
	<script src="src/app.js"></script>
</body>
</html>
